<!DOCTYPE html>
<html>
<head>
    <title>JS Test</title>
    <style>
        .screen { display: none; padding: 20px; border: 2px solid black; margin: 10px; }
        .active { display: block; }
    </style>
</head>
<body>

    <h1>Button Test Page</h1>

    <!-- Screen 1 -->
    <div id="page1" class="screen active" style="background-color: lightblue;">
        <h2>This is Page 1</h2>
        <button type="button" onclick="goToPage2()">Click to go to Page 2</button>
    </div>

    <!-- Screen 2 -->
    <div id="page2" class="screen" style="background-color: lightgreen;">
        <h2>This is Page 2</h2>
        <button type="button" onclick="goToPage1()">Go back to Page 1</button>
    </div>

    <script>
        // Change background color instantly to prove JS is running
        document.body.style.backgroundColor = "#e0e0e0";

        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
        }

        function goToPage1() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        }
    </script>
</body>
</html>
